<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V2Ray Egress Sidecar Routing</title>
<style>
:root{color-scheme:light;--bg:#f7f8f4;--panel:#fff;--text:#1d252c;--muted:#68717a;--line:#d9ded6;--accent:#0f766e;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{border-bottom:1px solid var(--line);background:#ffffffd9;position:sticky;top:0;backdrop-filter:saturate(140%) blur(8px);z-index:2}.wrap{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:4px}.nav{display:flex;gap:8px;margin-top:12px}.nav a{border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 10px;border-radius:6px;text-decoration:none}.nav a.active{border-color:var(--accent);color:#fff;background:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.row{display:grid;gap:6px;margin-bottom:12px}label{font-weight:600;font-size:12px;color:var(--muted)}select,textarea,input{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px;background:#fff;color:var(--text);font:inherit}textarea{min-height:178px;resize:vertical}.country-picker{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,.75fr);gap:8px}.hint{color:var(--muted);font-size:12px}.checks{display:flex;gap:14px;flex-wrap:wrap}.checks label{font-weight:500;color:var(--text)}.checks input{width:auto;margin-right:6px}
button{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:9px 12px;cursor:pointer;font-weight:650}button.secondary{background:#fff;color:var(--text);border-color:var(--line)}button.danger{border-color:var(--bad);background:#fff;color:var(--bad)}button:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap}
.status{white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;background:#fbfcfa;padding:12px;min-height:110px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:5px 8px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}.chip:hover{border-color:var(--accent);color:var(--accent);background:#f3fbf9}.chip:active{background:#e6f5f2}.muted{color:var(--muted)}.bad{color:var(--bad)}
.streaming{margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}.streaming h2{font-size:16px;margin:0}.stream-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.stream-head a{color:var(--accent);font-size:12px}.stream-input{margin:12px 0;max-width:650px}.stream-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}.stream-facts dt{font-size:12px;color:var(--muted)}.stream-facts dd{margin:4px 0 0;font-weight:600;overflow-wrap:anywhere}.stream-table{overflow:auto}.stream-table table{width:100%;border-collapse:collapse;min-width:560px}.stream-table th,.stream-table td{text-align:left;border-bottom:1px solid var(--line);padding:8px;overflow-wrap:anywhere}.stream-table th{font-size:12px;color:var(--muted)}[hidden]{display:none!important}
.service-matrix{overflow:auto;margin-top:14px}.service-matrix table{border-collapse:collapse;table-layout:fixed;min-width:1080px;width:100%;font-size:13px}.service-matrix th,.service-matrix td{border:1px solid var(--line);padding:9px 6px;text-align:center;overflow-wrap:anywhere}.service-matrix th:first-child{width:64px;background:#f0f3f2}.service-matrix thead th{background:#f0f3f2}.probe-good{color:#11633a;background:#e7f5eb}.probe-bad{color:#a52b25;background:#fff0ee}.probe-warn{color:#986214;background:#fff7e6}
@media(max-width:900px){.grid{grid-template-columns:1fr}.country-picker{grid-template-columns:1fr}.wrap{padding:12px}}
@media(max-width:600px){.stream-facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="wrap"><h1>V2Ray Egress Sidecar Routing</h1><div id="meta" class="sub">Loading...</div><div class="nav"><a href="./">Stats</a><a class="active" href="control.html">Routing</a></div></div></header>
<main class="wrap">
<section class="grid">
<div class="panel">
  <div class="row"><label for="profile">Site / app profile</label><select id="profile"></select></div>
  <div class="row"><label for="country-search">NordVPN country / 国家</label><div class="country-picker"><input id="country-search" placeholder="输入中文、英文或代码，例如：孟 / bang / bd"><select id="country"></select></div><div id="country-hint" class="hint"></div></div>
  <div class="row"><label for="domains">Domain suffixes routed to selected country</label><textarea id="domains" spellcheck="false"></textarea></div>
  <div class="checks">
    <label><input type="checkbox" id="include-ip" checked>Route ip.sb with this rule</label>
    <label><input type="checkbox" id="openvpn-tcp">Use OpenVPN TCP</label>
  </div>
  <div class="actions" style="margin-top:14px">
    <button id="apply">Apply Route</button>
    <button id="check" class="secondary">Check ip.sb</button>
    <button id="clear" class="danger">Clear UI Rules</button>
  </div>
</div>
<div class="panel">
  <div class="row"><label>Current UI-managed route</label><div id="current" class="status">Loading...</div></div>
  <div class="row"><label>Result</label><div id="result" class="status">Idle</div></div>
</div>
</section>
<section id="streaming-panel" class="streaming" hidden>
  <div class="stream-head"><h2>流媒体、自媒体与 AI 检测</h2><div class="actions"><a href="https://github.com/lmc999/RegionRestrictionCheck" target="_blank" rel="noopener">检测方法参考</a><button id="stream-test" class="secondary">检测当前服务</button><button id="matrix-test" class="secondary">检测常用服务</button></div></div>
  <div id="stream-titles-row" class="row stream-input" hidden><label for="stream-titles">Netflix 片名 ID 或链接（可选，最多 4 个）</label><input id="stream-titles" placeholder="例如 70143836 或 https://www.netflix.com/title/70143836"></div>
  <div id="stream-status" class="hint">尚未检测</div>
  <div id="stream-result"></div>
  <div id="matrix-result" class="service-matrix"></div>
</section>
<section class="panel" style="margin-top:16px">
  <div class="row"><label>Observed recent domains</label><div id="observed" class="chips"><span class="muted">Loading...</span></div></div>
</section>
</main>
<script>
let state=null, stats=null;
const $=id=>document.getElementById(id);
const basePath=location.pathname.includes('/sidecar-stats/')?'/sidecar-stats/':'./';
const regionNames=(typeof Intl!=='undefined'&&Intl.DisplayNames)?new Intl.DisplayNames(['zh-CN'],{type:'region'}):null;
let allCountryOptions=[];
let streamJob=null, streamTimer=null;
let streamPollGeneration=0;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function url(path){return basePath+path.replace(/^\/+/,'')}
async function fetchJson(path, options){
 const res=await fetch(url(path),options||{});
 const text=await res.text();
 let data=null;
 try{data=text?JSON.parse(text):null}catch(e){
  const preview=text.replace(/\s+/g,' ').slice(0,180);
  throw new Error(`API returned non-JSON HTTP ${res.status}: ${preview}`);
 }
 if(!res.ok||!data||data.ok===false)throw new Error(data?.error?(data.error+(data.details?': '+String(data.details):'')):`HTTP ${res.status}`);
 return data;
}
function setResult(text,bad=false){$('result').className='status '+(bad?'bad':'');$('result').textContent=text}
function domainsFromText(){return $('domains').value.split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean)}
function putDomains(domains){$('domains').value=(domains||[]).join('\n')}
function profileById(id){return (state.profiles||[]).find(p=>p.id===id)}
function countryOptions(){return (state.country_options||state.countries||[]).map(c=>typeof c==='string'?{name:c,code:''}:c)}
function countryLabel(country){
 const c=typeof country==='string'?(countryOptions().find(x=>x.name===country)||{name:country,code:''}):country;
 if(c&&c.code&&regionNames){
  try{const zh=regionNames.of(c.code);if(zh&&zh!==c.code)return zh}catch(e){}
 }
 return (c&&c.name)||String(country||'');
}
function countrySearchText(c){return `${countryLabel(c)} ${c.name||''} ${c.code||''}`.toLowerCase()}
function renderCountryOptions(keepValue){
 const query=($('country-search').value||'').trim().toLowerCase();
 let options=allCountryOptions;
 if(query)options=options.filter(c=>countrySearchText(c).includes(query));
 const keep=keepValue||$('country').value;
 $('country').innerHTML=options.map(c=>`<option value="${esc(c.name)}" title="${esc(c.name)}">${esc(countryLabel(c))}</option>`).join('');
 if(keep&&options.some(c=>c.name===keep))$('country').value=keep;
 if(!$('country').value&&options.length)$('country').value=options[0].name;
 $('country-hint').textContent=query?`匹配 ${options.length} / ${allCountryOptions.length} 个国家`:`共 ${allCountryOptions.length} 个国家；可输入“孟”“日本”“us”等过滤`;
}
function updateCountryHint(){
 const c=allCountryOptions.find(x=>x.name===$('country').value);
 if(c&&!($('country-search').value||'').trim()){
  const cached=(state.exits||[]).filter(x=>x.country===c.name&&x.status==='running');
  $('country-hint').textContent=`已选择：${countryLabel(c)} / ${c.name}${cached.length?' · 已有可复用出口':''}`;
 }
}
function renderCurrent(){
 const s=state.state||{};
 const lines=[];
 lines.push(`active: ${s.active?'yes':'no'}`);
 if(s.country)lines.push(`country: ${countryLabel(s.country)}`);
 if(s.profile)lines.push(`profile: ${s.profile}`);
 if(s.proxy)lines.push(`proxy: ${s.proxy}`);
 if(s.gluetun)lines.push(`gluetun: ${s.gluetun.status||'?'} / ${s.gluetun.health||'?'}`);
 if(s.container)lines.push(`container: ${s.container}`);
 lines.push(`事务: ${s.transaction_pending?'处理中 / 待恢复':'无待处理事务'}`);
 lines.push(`配置与已提交状态: ${s.config_matches_state===true?'一致':s.config_matches_state===false?'不一致':'尚未验证'}`);
 const t=s.last_transaction;
 if(t){lines.push(`最近事务: ${t.status} (${new Date(t.updated_at*1000).toLocaleString()})`);if(t.error)lines.push(`失败原因: ${t.error}`);if(t.rollback_error)lines.push(`回滚问题: ${t.rollback_error}`)}
 if(s.last_failure&&s.last_failure.updated_at!==t?.updated_at)lines.push(`上次失败: ${new Date(s.last_failure.updated_at*1000).toLocaleString()} ${s.last_failure.error||s.last_failure.status}`);
 if(s.domains&&s.domains.length)lines.push(`domains:\n  ${s.domains.join('\n  ')}`);
 $('current').textContent=lines.join('\n');
}
function renderState(){
 allCountryOptions=countryOptions().sort((a,b)=>countryLabel(a).localeCompare(countryLabel(b),'zh-CN'));
 $('meta').textContent=`已加载 ${allCountryOptions.length} 个 NordVPN 国家`;
 $('profile').innerHTML='<option value="custom">Custom</option>'+state.profiles.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
 const current=state.state||{};
 const selectedCountry=current.country||($('country').value)||((allCountryOptions[0]||{}).name);
 renderCountryOptions(selectedCountry);
 updateCountryHint();
 if(current.profile)$('profile').value=current.profile;
 if(current.domains&&current.domains.length)putDomains(current.domains);
 else {
   const p=profileById($('profile').value);
   if(p)putDomains(p.domains);
 }
 $('include-ip').checked=current.include_ip_sb!==false;
 $('openvpn-tcp').checked=current.protocol==='tcp';
 renderCurrent();
 updateStreamingPanel();
}
function renderObserved(){
 const rows=((stats&&stats.windows&&stats.windows['1h']&&stats.windows['1h'].domains)||[]).slice(0,40);
 if(!rows.length){$('observed').innerHTML='<span class="muted">No recent domains</span>';return}
 $('observed').innerHTML=rows.map(r=>`<button class="chip" data-domain="${esc(r.name)}">${esc(r.name)} · ${esc(r.total_human||'')}</button>`).join('');
 $('observed').querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
   const d=btn.dataset.domain;
   const cur=new Set(domainsFromText());
   cur.add(d);
   putDomains([...cur]);
   $('profile').value='custom';
   updateStreamingPanel();
 });
}
async function load(){
 const [s,j]=await Promise.all([
   fetchJson('api/state',{cache:'no-store'}),
   fetchJson('stats.json?ts='+Date.now(),{cache:'no-store'}).catch(()=>null)
 ]);
 state=s; stats=j; renderState(); renderObserved();
 if(s.country_refreshing)setTimeout(refreshCountries,3000);
}
async function refreshCountries(){
 try{
  const data=await fetchJson('api/state',{cache:'no-store'}), selected=$('country').value;
  state.country_options=data.country_options;state.countries=data.countries;
  allCountryOptions=countryOptions().sort((a,b)=>countryLabel(a).localeCompare(countryLabel(b),'zh-CN'));
  renderCountryOptions(selected);updateCountryHint();
  $('meta').textContent=`已加载 ${allCountryOptions.length} 个 NordVPN 国家`;
  if(data.country_refreshing)setTimeout(refreshCountries,5000);
 }catch(e){}
}
const streamLabels={unlocked:'解锁',originals_only:'仅自制剧',homepage_only:'仅首页可访问',service_available:'服务可用',region_unavailable:'地区不可用',ip_blocked:'检测到代理限制',browser_only:'仅网页可用',mobile_only:'仅移动端可用',http_refused:'请求被拒绝',challenge:'需要浏览器验证',network_error:'网络请求失败',unknown:'无法判断',homepage_accessible:'首页可访问',page_unknown:'无法判断页面',title_visible:'公开详情页可见',title_unavailable:'公开详情页不可见',title_unknown:'未能判断片名',manifest_available:'公开媒体接口可达'};
function matchesStream(job){return job&&(job.profile==='matrix'||job.profile===$('profile').value)&&job.country===$('country').value&&job.protocol===($('openvpn-tcp').checked?'tcp':'udp')}
function regionText(code){if(!code)return '未识别';try{return regionNames?`${regionNames.of(code)} (${code})`:code}catch(e){return code}}
function formatIp(data){return data?.ok?`IP: ${data.ip}\n国家: ${data.country_code?regionText(data.country_code):(data.country||'未识别')}${data.city?'\n城市: '+data.city:''}${data.country_source?'\n地区来源: '+data.country_source:''}`:`检测失败: ${data?.error||'未知错误'}`}
const matrixNames={'openai-chatgpt':'ChatGPT','claude-anthropic':'Claude','prime-video':'Amazon PV'};
function renderMatrix(reports){
 const items=reports||[],statuses=items.map(r=>r.unlock?.status||r.homepage.status), row=(name,cells)=>`<tr><th>${name}</th>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`;
 const stateCells=items.map((r,i)=>{const status=statuses[i],bad=['region_unavailable','ip_blocked','http_refused','network_error'].includes(status),good=status==='unlocked';return `<span class="${good?'probe-good':bad?'probe-bad':'probe-warn'}" title="${esc(r.unlock?.evidence||'')}" >${esc(streamLabels[status]||status)}${status==='http_refused'?' '+r.homepage.http_status:''}</span>`});
 const regionCells=items.map(r=>{const code=r.unlock?.region||r.homepage.region||(r.titles||[]).find(t=>t.region)?.region;return `<span title="${esc(code?(r.unlock?.region_source||'服务专用接口'):'出口 IP 数据库地区')}" >${esc(code||r.geoip.country_code||'?')}${code?'':' (IP)'}</span>`});
 const methodCells=items.map(r=>{const status=r.unlock?.status,usable=['unlocked','originals_only'].includes(status);return `<span title="${esc(r.dns?.checks?.map(c=>c.domain+': '+(c.method_label||'未知')).join('；')||'未执行 DNS 三项检查')}" >${esc(usable?(r.method_label||'未知'):'未形成解锁判定')}</span>`});
 $('matrix-result').innerHTML=items.length?'<table><thead>'+row('服务商',items.map(r=>esc(matrixNames[r.profile]||r.service)))+'</thead><tbody>'+row('状态',stateCells)+row('地区',regionCells)+row('方式',methodCells)+'</tbody></table>':'';
}
function renderStreamingJob(job){
 if(!matchesStream(job))return;
 $('stream-test').disabled=['queued','running'].includes(job.status)||!profileById($('profile').value)?.streaming;
 $('matrix-test').disabled=['queued','running'].includes(job.status);
 if(job.status==='queued'||job.status==='running'){
  $('stream-status').textContent=job.status==='queued'?'排队中':'检测中';return;
 }
 if(job.status!=='done'){$('stream-status').textContent=job.error||'检测未完成';return}
 const r=job.result;
 if(r.reports){
  $('stream-status').textContent=`检测于 ${new Date(r.finished_at*1000).toLocaleString('zh-CN')} · ${countryLabel(job.country)} · ${r.exit.reused?'复用已有出口':'新建出口'} · ${r.transport}`;
  $('stream-result').textContent='真实播放及账号权限：待验证';renderMatrix(r.reports);return;
 }
 const h=r.homepage, region=r.unlock?.region||h.region||(r.titles||[]).find(x=>x.region)?.region;
 $('stream-status').textContent=`检测于 ${new Date(r.finished_at*1000).toLocaleString('zh-CN')} · ${r.exit.reused?'复用已有出口':'新建出口'} · ${r.transport}`;
 const facts=[['出口 IP',r.geoip.ip||'未识别'],['IP 数据库国家',regionText(r.geoip.country_code)],['服务识别地区',regionText(region)],['平台判定',`${streamLabels[r.unlock?.status]||r.unlock?.status||'未判断'}${r.unlock?.evidence?' · '+r.unlock.evidence:''}`],['判定方式',r.unlock?.status&&['unlocked','originals_only'].includes(r.unlock.status)?(r.method_label||'未知'):'未形成解锁判定'],['首页',`${streamLabels[h.status]||h.status} (HTTP ${h.http_status})`],['代理节点',r.exit.container||r.exit.proxy],['真实播放','待账号及播放器验证']];
 if(r.eligibility)facts.push(['地区接口',`${streamLabels[r.eligibility.status]||r.eligibility.status} (HTTP ${r.eligibility.http_status})`]);
 $('stream-result').innerHTML='<dl class="stream-facts">'+facts.map(([label,value])=>`<div><dt>${esc(label)}</dt><dd>${esc(value)}</dd></div>`).join('')+'</dl>'+
 ((r.titles||[]).length?'<div class="stream-table"><table><thead><tr><th>片名 / ID</th><th>公开片库探测</th><th>地区</th><th>播放</th></tr></thead><tbody>'+r.titles.map(t=>`<tr><td>${esc(t.title||t.title_id)}<br><span class="muted">${esc(t.title_id)}</span></td><td>${esc(streamLabels[t.status]||t.status)} · HTTP ${t.http_status}</td><td>${esc(regionText(t.region))}</td><td>未验证</td></tr>`).join('')+'</tbody></table></div>':'');
}
function updateStreamingPanel(){
 const p=profileById($('profile').value);
 $('streaming-panel').hidden=false;
 $('stream-titles-row').hidden=p?.id!=='netflix';
 const job=matchesStream(streamJob)?streamJob:(state.streaming_jobs||[]).find(matchesStream);
 $('stream-result').innerHTML='';$('stream-status').textContent='尚未检测';$('stream-test').disabled=false;
 $('matrix-result').innerHTML='';$('matrix-test').disabled=false;
 if(job){
  renderStreamingJob(job);
  if(['queued','running'].includes(job.status)){
   if(streamTimer)clearTimeout(streamTimer);
   const generation=++streamPollGeneration;pollStreaming(job.id,generation);
  }
 }
 if(!p?.streaming)$('stream-test').disabled=true;
}
async function pollStreaming(identifier,generation=streamPollGeneration){
 try{
  const data=await fetchJson('api/streaming/'+identifier,{cache:'no-store'});
  if(generation!==streamPollGeneration)return;
  streamJob=data.job;
  state.streaming_jobs=[streamJob,...(state.streaming_jobs||[]).filter(x=>x.id!==identifier)];
  renderStreamingJob(streamJob);
  if(['queued','running'].includes(streamJob.status))streamTimer=setTimeout(()=>pollStreaming(identifier,generation),2000);
 }catch(e){if(generation!==streamPollGeneration)return;$('stream-status').textContent=String(e);$('stream-test').disabled=!profileById($('profile').value)?.streaming;$('matrix-test').disabled=false}
}
$('stream-test').onclick=async()=>{
 $('stream-test').disabled=true;$('matrix-test').disabled=true;$('stream-status').textContent='提交检测';$('stream-result').innerHTML='';$('matrix-result').innerHTML='';
 try{
  const body={profile:$('profile').value,country:$('country').value,protocol:$('openvpn-tcp').checked?'tcp':'udp',titles:$('profile').value==='netflix'?[$('stream-titles').value]:[]};
  const data=await fetchJson('api/streaming/test',{method:'POST',headers:{'Content-Type':'application/json','X-Sidecar-Admin':'1'},body:JSON.stringify(body)});
  if(streamTimer)clearTimeout(streamTimer);streamJob=data.job;renderStreamingJob(streamJob);pollStreaming(streamJob.id,++streamPollGeneration);
 }catch(e){$('stream-status').textContent=String(e);$('stream-test').disabled=!profileById($('profile').value)?.streaming;$('matrix-test').disabled=false}
};
$('matrix-test').onclick=async()=>{
 $('matrix-test').disabled=true;$('stream-test').disabled=true;$('stream-status').textContent='提交常用服务检测';$('matrix-result').innerHTML='';$('stream-result').innerHTML='';
 try{
  const body={profile:'matrix',country:$('country').value,protocol:$('openvpn-tcp').checked?'tcp':'udp',titles:[$('stream-titles').value]};
  const data=await fetchJson('api/streaming/test',{method:'POST',headers:{'Content-Type':'application/json','X-Sidecar-Admin':'1'},body:JSON.stringify(body)});
  if(streamTimer)clearTimeout(streamTimer);streamJob=data.job;renderStreamingJob(streamJob);pollStreaming(streamJob.id,++streamPollGeneration);
 }catch(e){$('stream-status').textContent=String(e);$('stream-test').disabled=!profileById($('profile').value)?.streaming;$('matrix-test').disabled=false}
};
$('profile').onchange=()=>{const p=profileById($('profile').value); if(p)putDomains(p.domains);updateStreamingPanel()}
$('country-search').oninput=()=>{renderCountryOptions();updateStreamingPanel()};
$('country').onchange=()=>{updateCountryHint();updateStreamingPanel()};
$('openvpn-tcp').onchange=()=>updateStreamingPanel();
$('apply').onclick=async()=>{
 $('apply').disabled=true; setResult('Applying route. Starting or switching Gluetun can take about 1-2 minutes...');
 try{
  const body={profile:$('profile').value,country:$('country').value,domains:domainsFromText(),include_ip_sb:$('include-ip').checked,protocol:$('openvpn-tcp').checked?'tcp':'udp'};
  const data=await fetchJson('api/apply',{method:'POST',headers:{'Content-Type':'application/json','X-Sidecar-Admin':'1'},body:JSON.stringify(body)});
  state.state=data.state; renderCurrent();
  setResult(`Applied (hot reload confirmed).\ncountry: ${countryLabel(data.state.country)}\ncontainer: ${data.state.container}\nexit reused: ${data.exit_reused?'yes':'no'}\n出口验证: ${formatIp(data.exit_check)}\nip.sb 路由检测: ${formatIp(data.ip_check)}\nbackup: ${data.backup}`);
 }catch(e){setResult(String(e),true);try{const latest=await fetchJson('api/state');state.state=latest.state;renderCurrent()}catch(_){}}
 finally{$('apply').disabled=false}
};
$('clear').onclick=async()=>{
 if(!confirm('Clear only the UI-managed rules? Existing non-UI rules stay in config.'))return;
 setResult('Clearing UI-managed rules...');
 try{
  const data=await fetchJson('api/clear',{method:'POST',headers:{'Content-Type':'application/json','X-Sidecar-Admin':'1'},body:'{}'});
  state.state=data.state; renderCurrent(); setResult(`Cleared.\nbackup: ${data.backup}`);
 }catch(e){setResult(String(e),true);try{const latest=await fetchJson('api/state');state.state=latest.state;renderCurrent()}catch(_){}}
};
$('check').onclick=async()=>{
 setResult('Checking api.ip.sb through sidecar SOCKS...');
 try{
  const data=await fetchJson('api/ipcheck',{cache:'no-store'});
  setResult(formatIp(data),!data.ok);
 }catch(e){setResult(String(e),true)}
};
load().catch(e=>{setResult(String(e),true);$('meta').textContent='Load failed'});
</script>
</body>
</html>
